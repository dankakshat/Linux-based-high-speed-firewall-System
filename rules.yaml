- name: SSH_BRUTE_FORCE
  type: threshold
  match_type: ssh_failed
  threshold: 5
  window_seconds: 60
  severity: high
  mitre: T1110
  action: block
  block_seconds: 600

- name: HTTP_ATTACK
  type: threshold
  match_type: http_sqli
  threshold: 1
  window_seconds: 60
  severity: critical
  mitre: T1190
  action: block
  block_seconds: 600
  patterns:
    - "union.*select"
    - "' or 1=1"
    - "\\.\\./"
    - "%2e%2e"
    - "<script"

- name: PORT_SCAN
  type: threshold
  match_type: port_scan
  threshold: 1
  window_seconds: 60
  severity: medium
  mitre: T1046
  action: block
  block_seconds: 300

- name: SYN_FLOOD
  type: threshold
  match_type: syn_flood
  threshold: 1
  window_seconds: 30
  severity: critical
  mitre: T1498
  action: block
  block_seconds: 900

- name: SCAN_THEN_BRUTE
  type: sequence
  steps:
    - port_scan
    - ssh_failed
  within_seconds: 300
  severity: critical
  mitre:
    - T1046
    - T1110
  action: block
  block_seconds: 3600
