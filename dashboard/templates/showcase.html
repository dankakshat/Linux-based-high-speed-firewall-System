<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XDP-Engine | Live Showcase</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070b14;
      color: #eef3ff;
      padding: 28px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .mode-pill {
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
    }
    .mode-enforce { background: #7f1d1d; color: #fecaca; border: 2px solid #ef4444; }
    .mode-detect { background: #1e3a8a; color: #bfdbfe; border: 2px solid #3b82f6; }
    .mode-offline { background: #1e293b; color: #94a3b8; border: 2px solid #475569; }
    .hero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .panel {
      background: #101729;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
    }
    .big-num { font-size: 2.6rem; font-weight: 800; margin-top: 8px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .block-card {
      background: #171f36;
      border: 1px solid #ef4444;
      border-radius: 10px;
      padding: 12px;
    }
    .feed {
      margin-top: 12px;
      max-height: 260px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
    }
    .feed-item { padding: 6px 0; border-bottom: 1px solid #1e293b; }
    a { color: #93c5fd; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1 style="margin:0;">XDP-Engine Live Mitigation Showcase</h1>
      <a href="/">← Back to Operations View</a>
    </div>
    <div id="modeBadge" class="mode-pill mode-offline">Loading Mode...</div>
  </div>

  <div class="hero">
    <div class="panel">
      <div style="color:#94a3b8;">TOTAL PACKETS DROPPED</div>
      <div id="dropped" class="big-num" style="color:#f87171;">0</div>
    </div>
    <div class="panel">
      <div style="color:#94a3b8;">DROP RATE METER</div>
      <div id="rate" class="big-num" style="color:#fbbf24;">0 pps</div>
    </div>
    <div class="panel">
      <div style="color:#94a3b8;">ACTIVE BLOCKED IPS</div>
      <div id="blockCount" class="big-num" style="color:#60a5fa;">0</div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <h2 style="margin:0;">Active Attack Blocks</h2>
    <div id="blockCards" class="cards"></div>
  </div>

  <div class="panel">
    <h2 style="margin:0;">Live Engine Feed</h2>
    <div id="feed" class="feed"></div>
  </div>

  <script>
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text ?? "");
      return div.innerHTML;
    }

    async function tick() {
      try {
        const res = await fetch("/api/overview");
        const data = await res.json();
        const st = data.status;

        const badge = document.getElementById("modeBadge");
        if (st.status !== "ONLINE") {
          badge.textContent = "ENGINE OFFLINE";
          badge.className = "mode-pill mode-offline";
        } else if (st.mode === "enforce") {
          badge.textContent = "ENFORCE MODE";
          badge.className = "mode-pill mode-enforce";
        } else {
          badge.textContent = "DETECT MODE";
          badge.className = "mode-pill mode-detect";
        }

        document.getElementById("dropped").textContent = st.dropped.toLocaleString();
        document.getElementById("rate").textContent = `${st.drop_rate_pps} pps`;
        document.getElementById("blockCount").textContent = data.blocks.length;

        document.getElementById("blockCards").innerHTML = data.blocks.length
          ? data.blocks.map(b => `
              <div class="block-card">
                <div style="font-weight:700; font-size:1.05rem;">${escapeHtml(b.ip)}</div>
                <div style="color:#cbd5e1; font-size:0.85rem; margin:4px 0;">Rule: ${escapeHtml(b.reason)}</div>
                <div style="color:#fca5a5; font-size:0.82rem;">Hits: ${b.hits} | TTL: ${b.remaining_seconds < 0 ? "permanent" : b.remaining_seconds + "s"}</div>
              </div>`).join("")
          : `<div style="color:#94a3b8;">No active IP blocks right now.</div>`;

        document.getElementById("feed").innerHTML = data.feed.length
          ? data.feed.map(f => `
              <div class="feed-item">
                <strong>[${escapeHtml(f.category)}]</strong> ${escapeHtml(f.message)}
              </div>`).join("")
          : `<div style="color:#94a3b8;">Waiting for events...</div>`;
      } catch (err) {
        console.error(err);
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
